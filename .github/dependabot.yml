version: 2

updates:
  - package-ecosystem: "uv"
    # The root uv updater also discovers direct-child /docker requirements.
    # Include the deeper dev toolbox explicitly without a duplicate /docker job.
    directories:
      - "/"
      - "/dev/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "no-bump"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "no-bump"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - "*"
