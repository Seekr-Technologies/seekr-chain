name: Build Nix Runner Image

on:
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read image version
        id: version
        run: echo "tag=$(cat docker/nix-runner.version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse if tag already exists
        run: |
          TAG="ghcr.io/seekr-technologies/seekr-chain-nix-runner:${{ steps.version.outputs.tag }}"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "Error: $TAG already exists."
            echo "Bump docker/nix-runner.version before building a new image."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker
          file: docker/Dockerfile.nix-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/seekr-technologies/seekr-chain-nix-runner:${{ steps.version.outputs.tag }}
            ghcr.io/seekr-technologies/seekr-chain-nix-runner:latest
