name: Build Nix Runner Image

on:
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read image version
        id: version
        run: echo "tag=$(cat docker/nix-runner.version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke test native runner image
        run: |
          docker build --no-cache --pull --file docker/Dockerfile.nix-runner --tag seekr-chain-nix-runner:smoke docker
          sh docker/test-nix-runner.sh seekr-chain-nix-runner:smoke
          sh docker/test-certificates.sh seekr-chain-nix-runner:smoke nix-runner

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse if tag already exists
        run: |
          TAG="ghcr.io/seekr-technologies/seekr-chain-nix-runner:${{ steps.version.outputs.tag }}"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "Error: $TAG already exists."
            echo "Bump docker/nix-runner.version before building a new image."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile.nix-runner
          platforms: linux/amd64,linux/arm64
          no-cache: true
          pull: true
          push: true
          tags: |
            ghcr.io/seekr-technologies/seekr-chain-nix-runner:${{ steps.version.outputs.tag }}
            ghcr.io/seekr-technologies/seekr-chain-nix-runner:latest
