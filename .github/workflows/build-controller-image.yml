name: Build Controller Image

on:
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read image version
        id: version
        run: echo "tag=$(cat docker/controller.version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse if tag already exists
        run: |
          TAG="ghcr.io/seekr-technologies/seekr-chain-controller:${{ steps.version.outputs.tag }}"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "Error: $TAG already exists."
            echo "Bump docker/controller.version before building a new image."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker
          file: docker/Dockerfile.controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/seekr-technologies/seekr-chain-controller:${{ steps.version.outputs.tag }}
            ghcr.io/seekr-technologies/seekr-chain-controller:latest
